<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>stub. — links, printed short</title>
    <meta name="description" content="A link shortener that prints you a ticket. Paste a long URL, get a short stub to tear off and share." />
    <meta name="theme-color" content="#F4EFE6" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Schibsted+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400..700&family=Caveat:wght@500..700&display=swap"
    />
    <script>
      // Set the theme before first paint so there is no flash.
      try {
        var t = JSON.parse(localStorage.getItem('stub.theme'));
      } catch (e) {}
      document.documentElement.dataset.theme =
        t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
